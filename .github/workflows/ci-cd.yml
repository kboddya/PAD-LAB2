name: ShopFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target deployment simulation environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  test:
    name: Test, Lint Manifests & Security Audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full microservice, K8s & CI test suite
        run: pytest -v --junitxml=test-results.xml

      - name: Validate Docker Compose topology
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate Kubernetes Kustomize manifests
        run: kubectl kustomize k8s > /dev/null

      - name: Run OWASP API Security audit
        run: |
          python scripts/security_audit.py --phase after
          python -c "import json; r = json.load(open('experiments/security_after.json')); assert r['failed'] == 0, r"

      - name: Run Kubernetes CIS & PSS Restricted audit
        run: python scripts/k8s_security_audit.py --phase after --strict

      - name: Upload test and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-audit-reports
          path: |
            test-results.xml
            experiments/security_after.json
            experiments/k8s_security_after.json

  build-images:
    name: Build 14 Microservice Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build all 14 ShopFlow Docker images
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_TAG="${IMAGE_TAG::8}" bash docker/build-images.sh
          docker images --format "table {{.Repository}}:{{.Tag}}\t{{.Size}}" | grep "^shopflow/"

  deploy-simulation:
    name: Simulated Kubernetes Deployment & Smoke Verification
    runs-on: ubuntu-latest
    needs: [test, build-images]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute staged deployment simulation & smoke test
        run: |
          python scripts/simulate_deploy.py \
            --environment "${{ inputs.environment || 'staging' }}" \
            --image-tag "${GITHUB_SHA::8}" \
            --output-dir deploy-artifacts

      - name: Upload deployment simulation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-simulation-artifacts
          path: |
            deploy-artifacts/deploy-bundle.yaml
            deploy-artifacts/deploy-report.json
